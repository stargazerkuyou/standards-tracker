plugins {
    id 'com.android.application'
}

def vc = (project.findProperty('versionCode') ?: '1').toString().toInteger()
// 签名钥匙和密码放在仓库里（个人自用），保证每次打包签名一致，手机上能直接覆盖升级
def ks = new Properties()
ks.load(new FileInputStream(rootProject.file('keystore.properties')))

android {
    namespace 'com.zevarl.zhunze'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zevarl.zhunze'
        minSdk 24
        targetSdk 34
        versionCode vc
        versionName "1.0.${vc}"
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword ks['storePassword']
            keyAlias ks['keyAlias']
            keyPassword ks['storePassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
