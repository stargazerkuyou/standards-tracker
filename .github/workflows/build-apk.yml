# 改了 App 界面或安卓外壳时，自动打包 APK，发布到 Releases 页面（手机上直接下载安装）
name: 打包安卓 APK

on:
  push:
    branches: [main]
    paths: ["app/**", "android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 放入网页
        run: |
          mkdir -p android/app/src/main/assets
          cp app/index.html android/app/src/main/assets/index.html

      - name: 准备签名（每次用同一把钥匙签名，手机上才能覆盖安装）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "SIGN=1" >> $GITHUB_ENV
          else
            echo "::warning::没有配置 ANDROID_KEYSTORE_B64，这次用临时调试签名；以后换成正式签名时，需要先卸载旧版再安装"
          fi

      - name: 打包
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "$SIGN" = "1" ]; then
            gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../zhunze-${{ github.run_number }}.apk
          else
            gradle assembleDebug -PversionCode=${{ github.run_number }} --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../zhunze-${{ github.run_number }}.apk
          fi

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 准则追踪 第 ${{ github.run_number }} 版
          body: "提交：${{ github.event.head_commit.message || '手动打包' }}"
          files: zhunze-${{ github.run_number }}.apk
