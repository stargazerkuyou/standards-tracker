# 改了 App 界面或安卓外壳时，自动打包 APK，发布到 Releases 页面（手机上直接下载安装）
name: 打包安卓 APK

on:
  push:
    branches: [main]
    paths: ["app/**", "android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 放入网页
        run: |
          mkdir -p android/app/src/main/assets
          cp app/index.html android/app/src/main/assets/index.html

      - name: 打包（签名钥匙在 android/app/release.keystore）
        working-directory: android
        run: |
          if ! gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon > build.log 2>&1; then
            tail -60 build.log
            echo "::error::打包失败：$(grep -E 'error:|What went wrong|Exception|^> ' build.log | head -8 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          tail -5 build.log
          cp app/build/outputs/apk/release/app-release.apk ../zhunze-${{ github.run_number }}.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 准则追踪 第 ${{ github.run_number }} 版
          body: "提交：${{ github.event.head_commit.message || '手动打包' }}"
          files: zhunze-${{ github.run_number }}.apk
